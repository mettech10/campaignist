services:
  - type: web
    name: ai-marketing-api
    runtime: python
    region: frankfurt
    # Starter ($7/mo). Chosen over free because free instances spin down after
    # ~15 minutes idle: a generation runs in a background thread, so a spin-down
    # mid-run would strand the campaign in `generating` with the credit spent.
    plan: starter
    # requirements.txt and wsgi.py live in api/, not at the repo root. Creating
    # the service manually instead of from this Blueprint leaves rootDir unset,
    # and the build fails on "Could not open requirements file".
    rootDir: api
    buildCommand: pip install -r requirements.txt
    # Threads, not processes: model calls are I/O-bound, and the pipeline runner
    # uses background threads that must share the worker. --threads > 1 is what
    # switches gunicorn from the sync worker to gthread.
    startCommand: gunicorn wsgi:app --workers 2 --threads 8 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: FLASK_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: KIMI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: CORS_ORIGINS
        sync: false
